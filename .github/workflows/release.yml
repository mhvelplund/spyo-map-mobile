name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - run: npm ci
      - run: npx cap sync android

      - name: Decode signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "ANDROID_KEYSTORE_BASE64 secret is missing"; exit 1; }
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/spyo-release.jks"

      - name: Test and build signed APK
        working-directory: android
        env:
          SPYO_KEYSTORE_PATH: ${{ runner.temp }}/spyo-release.jks
          SPYO_KEYSTORE_PASSWORD: ${{ secrets.SPYO_KEYSTORE_PASSWORD }}
          SPYO_KEY_ALIAS: ${{ secrets.SPYO_KEY_ALIAS }}
          SPYO_KEY_PASSWORD: ${{ secrets.SPYO_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew testReleaseUnitTest assembleRelease -PappVersion="${GITHUB_REF_NAME#v}"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk "spyo-map-${GITHUB_REF_NAME}.apk"
          gh release create "$GITHUB_REF_NAME" "spyo-map-${GITHUB_REF_NAME}.apk" --generate-notes
