apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

// Release builds pass -PappVersion=x.y.z (from the git tag); local builds are 0.0.0-dev and never see updates.
// versionCode formula must match Versions.code() in Versions.kt.
def appVersion = (project.findProperty('appVersion') ?: '0.0.0-dev').toString()
def appVersionMatch = appVersion =~ /^(\d+)\.(\d+)\.(\d+)$/
def appVersionCode = appVersionMatch.matches()
    ? appVersionMatch.group(1).toInteger() * 10000 + appVersionMatch.group(2).toInteger() * 100 + appVersionMatch.group(3).toInteger()
    : 1
def releaseKeystore = System.getenv('SPYO_KEYSTORE_PATH')

android {
    namespace = "net.isntall.spyomap"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "net.isntall.spyomap"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersion
        buildConfigField "String", "WEB_CLIENT_ID", "\"${project.findProperty('spyoWebClientId') ?: ''}\""
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildFeatures {
        buildConfig = true
    }
    testOptions {
        unitTests.returnDefaultValues = true
    }
    signingConfigs {
        release {
            if (releaseKeystore) {
                storeFile file(releaseKeystore)
                storePassword System.getenv('SPYO_KEYSTORE_PASSWORD')
                keyAlias System.getenv('SPYO_KEY_ALIAS')
                keyPassword System.getenv('SPYO_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            signingConfig releaseKeystore ? signingConfigs.release : null
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation "androidx.credentials:credentials:1.6.0"
    implementation "androidx.credentials:credentials-play-services-auth:1.6.0"
    implementation "com.google.android.libraries.identity.googleid:googleid:1.2.1"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0"
    testImplementation "junit:junit:$junitVersion"
    // Real org.json for JVM unit tests (android.jar only has stubs).
    testImplementation "org.json:json:20250517"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
